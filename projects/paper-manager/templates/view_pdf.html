<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ filename }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #2d2d2d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background: #1a1a1a;
      border-bottom: 1px solid #444;
      height: 48px;
      flex-shrink: 0;
    }
    .toolbar .filename {
      font-size: 0.85rem;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: calc(100% - 160px);
    }
    .btn-dl {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      background: #4338ca;
      color: #fff;
      border-radius: 6px;
      font-size: 0.82rem;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-dl:hover { background: #3730a3; }

    .viewer {
      width: 100%;
      height: calc(100vh - 48px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="filename">{{ filename }}</span>
    <a class="btn-dl" href="/pdf/{{ job_id }}?download=true" download="{{ filename }}">
      ↓ ダウンロード
    </a>
  </div>
  <iframe
    class="viewer"
    src="/pdf/{{ job_id }}"
    title="{{ filename }}"
  ></iframe>
</body>
</html>
