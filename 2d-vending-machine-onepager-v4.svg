<text x="1284" y="56" font-family="Avenir,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start" class=""><tspan x="1284" dy="0">2D VENDING MACHINE</tspan></text>

<!-- Title -->
<text x="70" y="166" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Arial,sans-serif" font-size="62" font-weight="900" fill="#08223A" text-anchor="start" class=""><tspan x="70" dy="0">2D自販機</tspan></text>
<text x="72" y="220" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Arial,sans-serif" font-size="30" font-weight="800" fill="#067CA3" text-anchor="start" class=""><tspan x="72" dy="0">ポスターが、そのまま自販機になる。</tspan></text>
<text x="72" y="270" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Arial,sans-serif" font-size="25" font-weight="500" fill="#29475D" text-anchor="start" class=""><tspan x="72" dy="0">平面のポスター・パネル・POPに商品枠を置き、</tspan><tspan x="72" dy="36">スマホのタッチ / QRで購入・受取までつなげる販売導線。</tspan></text>

