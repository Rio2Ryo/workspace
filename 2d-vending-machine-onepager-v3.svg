      <text x="1208" y="724" class="jp" font-size="16" font-weight="800" fill="#FFFFFF">買う</text>
      <text x="1208" y="744" class="jp" font-size="12" fill="#BDEFFF">決済</text>
      <path d="M1292 728 L1306 728" stroke="#6ECFE8" stroke-width="3" stroke-linecap="round"/>
    </g>
<g>
      <circle cx="1325" cy="728" r="17" fill="#38F0C2"/>
      <text x="1325" y="735" text-anchor="middle" class="en" font-size="14" font-weight="900" fill="#08223A">4</text>
      <text x="1353" y="724" class="jp" font-size="16" font-weight="800" fill="#FFFFFF">受け取る</text>
      <text x="1353" y="744" class="jp" font-size="12" fill="#BDEFFF">現地 / 配送</text>
      
    </g>

