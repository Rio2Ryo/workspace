    <text x="164" y="752" class="en" font-size="18" font-weight="900" fill="#17D8F5">NFC</text>
    <path d="M222 735 C240 746 240 746 222 758" stroke="#17D8F5" stroke-width="4" fill="none" stroke-linecap="round"/>
