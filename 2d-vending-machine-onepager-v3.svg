  <text x="70" y="844" class="jp" font-size="20" font-weight="800" fill="#08223A">活用シーン</text>
  <rect x="190" y="819" width="250" height="38" rx="19" fill="#FFFFFF" stroke="#D8EEF6"/><text x="315" y="844" text-anchor="middle" class="jp" font-size="16" font-weight="700" fill="#36566C">アイドル/アーティストグッズ</text>
<rect x="458" y="819" width="74" height="38" rx="19" fill="#FFFFFF" stroke="#D8EEF6"/><text x="495" y="844" text-anchor="middle" class="jp" font-size="16" font-weight="700" fill="#36566C">トレカ</text>
<rect x="550" y="819" width="170" height="38" rx="19" fill="#FFFFFF" stroke="#D8EEF6"/><text x="635" y="844" text-anchor="middle" class="jp" font-size="16" font-weight="700" fill="#36566C">イベント限定商品</text>
<rect x="738" y="819" width="170" height="38" rx="19" fill="#FFFFFF" stroke="#D8EEF6"/><text x="823" y="844" text-anchor="middle" class="jp" font-size="16" font-weight="700" fill="#36566C">観光地限定商品</text>
