        <text x="203" y="694" text-anchor="middle" class="jp" font-size="14" fill="#6A7F90">商品枠</text>
      </g>
<g>
        <rect x="310" y="598" width="142" height="104" rx="18" fill="#FFFFFF" opacity="0.96"/>
        <rect x="324" y="612" width="114" height="42" rx="13" fill="#5A8CFF" opacity="0.95"/>
        <circle cx="381" cy="633" r="17" fill="#FFFFFF" opacity="0.35"/>
        <text x="381" y="675" text-anchor="middle" class="jp" font-size="19" font-weight="800" fill="#08223A">推し活</text>
        <text x="381" y="694" text-anchor="middle" class="jp" font-size="14" fill="#6A7F90">商品枠</text>
      </g>
<g>
        <rect x="488" y="598" width="142" height="104" rx="18" fill="#FFFFFF" opacity="0.96"/>
        <rect x="502" y="612" width="114" height="42" rx="13" fill="#A06BFF" opacity="0.95"/>
        <circle cx="559" cy="633" r="17" fill="#FFFFFF" opacity="0.35"/>
