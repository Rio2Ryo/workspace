    <rect x="512" y="718" width="7" height="7" fill="#08223A"/><rect x="522" y="718" width="7" height="7" fill="#08223A"/><rect x="542" y="718" width="7" height="7" fill="#08223A"/><rect x="512" y="728" width="7" height="7" fill="#08223A"/><rect x="522" y="728" width="7" height="7" fill="#08223A"/><rect x="552" y="728" width="7" height="7" fill="#08223A"/><rect x="532" y="738" width="7" height="7" fill="#08223A"/><rect x="512" y="748" width="7" height="7" fill="#08223A"/><rect x="542" y="748" width="7" height="7" fill="#08223A"/><rect x="552" y="748" width="7" height="7" fill="#08223A"/><rect x="522" y="758" width="7" height="7" fill="#08223A"/><rect x="542" y="758" width="7" height="7" fill="#08223A"/><rect x="552" y="758" width="7" height="7" fill="#08223A"/>
