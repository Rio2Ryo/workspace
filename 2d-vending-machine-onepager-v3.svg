      <text x="1035" y="735" text-anchor="middle" class="en" font-size="14" font-weight="900" fill="#08223A">2</text>
      <text x="1063" y="724" class="jp" font-size="16" font-weight="800" fill="#FFFFFF">触れる</text>
      <text x="1063" y="744" class="jp" font-size="12" fill="#BDEFFF">NFC / QR</text>
      <path d="M1147 728 L1161 728" stroke="#6ECFE8" stroke-width="3" stroke-linecap="round"/>
    </g>
<g>
