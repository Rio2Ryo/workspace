        <circle cx="381" cy="499" r="17" fill="#FFFFFF" opacity="0.35"/>
        <text x="381" y="541" text-anchor="middle" class="jp" font-size="19" font-weight="800" fill="#08223A">限定B</text>
        <text x="381" y="560" text-anchor="middle" class="jp" font-size="14" fill="#6A7F90">商品枠</text>
      </g>
<g>
